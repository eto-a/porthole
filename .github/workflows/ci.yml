name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Build
        run: go build ./...
      - name: Test (race detector, shuffled)
        if: runner.os == 'Linux'
        run: go test -race -shuffle=on -count=1 ./...
      - name: Test
        if: runner.os != 'Linux'
        run: go test -count=1 ./...

  # Protocol compatibility (DESIGN.md section 6): the e2e scenarios, which run real binaries in separate processes,
  # once with the previous release's client against the server built from this commit, and once the other way
  # round. The server accepts protocol versions N and N-1, so both directions must keep working. The previous
  # release is the newest published one, pre-releases included. Not a required check.
  compat:
    name: compat (previous release)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Download and verify the previous release
        id: baseline
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          DEST: ${{ runner.temp }}/baseline
        run: |
          tag=$(gh release list --exclude-drafts --limit 1 --json tagName --jq '.[0].tagName // empty')
          if [ -z "$tag" ]; then
            echo "::notice::No published release yet; nothing to compare against."
            exit 0
          fi
          mkdir -p "$DEST"
          gh release download "$tag" --dir "$DEST" \
            --pattern checksums.txt \
            --pattern 'portholed_*_linux_amd64.tar.gz' \
            --pattern 'porthole_*_linux_amd64.tar.gz'
          cd "$DEST"
          # Each archive must be listed in checksums.txt and match it (an empty selection makes sha256sum fail).
          for f in portholed_*_linux_amd64.tar.gz porthole_*_linux_amd64.tar.gz; do
            awk -v f="$f" '$2 == f' checksums.txt | sha256sum --check --strict -
            tar -xzf "$f" "${f%%_*}"
          done
          ./portholed version
          ./porthole version
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Previous client, current server
        if: steps.baseline.outputs.tag != ''
        env:
          PORTHOLE_E2E_COMPAT: "1"
          PORTHOLE_E2E_CLIENT_BIN: ${{ runner.temp }}/baseline/porthole
        run: go test -count=1 -v ./tests/e2e/
      - name: Current client, previous server
        if: steps.baseline.outputs.tag != ''
        env:
          PORTHOLE_E2E_COMPAT: "1"
          PORTHOLE_E2E_SERVER_BIN: ${{ runner.temp }}/baseline/portholed
        run: go test -count=1 -v ./tests/e2e/

  # The client as a real operating system service (ADR 0006): `porthole service install` registers a systemd unit, a
  # launchd job or a Windows service on the runner, which has the rights for it (passwordless sudo on Linux and macOS,
  # an administrator on Windows), and the e2e scenario drives it against a local portholed. The tests change the
  # machine, so they run only behind PORTHOLE_TEST_SERVICE=1. Not a required check until it has been stable.
  service:
    name: service (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      PORTHOLE_TEST_SERVICE: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Build the binaries and the test
        # Built once as the runner user: the system test runs under sudo, which has no Go toolchain environment.
        shell: bash
        run: |
          ext=""
          if [ "$RUNNER_OS" = Windows ]; then ext=".exe"; fi
          mkdir -p "$RUNNER_TEMP/bin"
          go build -o "$RUNNER_TEMP/bin/portholed$ext" ./cmd/portholed
          go build -o "$RUNNER_TEMP/bin/porthole$ext" ./cmd/porthole
          go test -c -o "$RUNNER_TEMP/bin/e2e.test$ext" ./tests/e2e
          {
            echo "PORTHOLE_E2E_SERVER_BIN=$RUNNER_TEMP/bin/portholed$ext"
            echo "PORTHOLE_E2E_CLIENT_BIN=$RUNNER_TEMP/bin/porthole$ext"
            echo "E2E_TEST_BIN=$RUNNER_TEMP/bin/e2e.test$ext"
          } >> "$GITHUB_ENV"
      - name: System service (install, status, tunnel, reload, stop, start, uninstall)
        shell: bash
        run: |
          sudo_cmd=()
          if [ "$RUNNER_OS" != Windows ]; then sudo_cmd=(sudo -E); fi
          "${sudo_cmd[@]}" "$E2E_TEST_BIN" -test.run '^TestServiceSystem(CopiesUnsafeBinary)?$' -test.v -test.count=1 -test.timeout=10m
      - name: User service (systemd user unit, LaunchAgent; skipped where the runner has no user session)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            # The runner has no login session; lingering starts the user's systemd manager.
            sudo loginctl enable-linger "$(id -un)"
            XDG_RUNTIME_DIR="/run/user/$(id -u)"
            export XDG_RUNTIME_DIR
            for _ in $(seq 1 30); do
              if systemctl --user show-environment >/dev/null 2>&1; then break; fi
              sleep 1
            done
          fi
          "$E2E_TEST_BIN" -test.run '^TestServiceUser$' -test.v -test.count=1 -test.timeout=10m
      - name: Windows service and system pipe against the real SCM
        if: runner.os == 'Windows'
        env:
          PORTHOLE_TEST_SYSTEM_PIPE: "1"
        run: go test -count=1 -v -run 'TestWindowsServiceLifecycle|TestSystemPipeElevated' ./internal/service/ ./internal/localapi/

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.14.0

  vuln:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: govulncheck
        # govulncheck is pinned as a tool dependency in go.mod, so Dependabot keeps it current.
        run: go tool govulncheck ./...

  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Fuzz frame decoder
        run: go test -run='^$' -fuzz='^FuzzReadMessage$' -fuzztime=30s ./internal/proto
      - name: Fuzz token parser
        run: go test -run='^$' -fuzz='^FuzzParse$' -fuzztime=30s ./internal/auth

  shellcheck:
    name: shell lint (shellcheck)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: ShellCheck
        # koalaman/shellcheck v0.11.0, pinned by the digest of its multi-arch index. Dependabot does not see this
        # line: update tag and digest by hand (docker buildx imagetools inspect koalaman/shellcheck:<tag>).
        run: >-
          docker run --rm --volume "$PWD:/mnt:ro" --workdir /mnt
          koalaman/shellcheck:v0.11.0@sha256:61862eba1fcf09a484ebcc6feea46f1782532571a34ed51fedf90dd25f925a8d
          -x install.sh packaging/scripts/*.sh packaging/test/*.sh

  zizmor:
    name: workflow lint (zizmor)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run zizmor
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          advanced-security: false
          version: v1.30.1
