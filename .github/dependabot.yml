version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7 # do not adopt releases younger than a week
    groups:
      go-dependencies:
        patterns:
          - "*"
    commit-message:
      prefix: "build"
      include: scope

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7 # do not adopt releases younger than a week
    groups:
      github-actions:
        patterns:
          - "*"
    commit-message:
      prefix: "ci"
      include: scope

  # Base images pinned by digest in the Dockerfiles.
  - package-ecosystem: docker
    directories:
      - /packaging
      - /deploy
    schedule:
      interval: monthly
    cooldown:
      default-days: 7 # do not adopt releases younger than a week
    groups:
      docker-images:
        patterns:
          - "*"
    commit-message:
      prefix: "build"
      include: scope
