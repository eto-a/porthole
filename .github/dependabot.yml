version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7 # do not adopt releases younger than a week
    groups:
      go-dependencies:
        patterns:
          - "*"
    commit-message:
      prefix: "deps"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7 # do not adopt releases younger than a week
    groups:
      github-actions:
        patterns:
          - "*"
    commit-message:
      prefix: "ci"
