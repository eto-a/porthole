# portholed behind the Traefik of Dokploy, with TLS passthrough (ADR 0004, docs/server.md).
#
# Traefik owns ports 80 and 443 but cannot issue a wildcard certificate without a DNS-01 provider. So it does not
# terminate TLS for the tunnel hosts: it passes the TLS connection through by SNI to portholed, which gets one
# certificate per host name from Let's Encrypt itself (TLS mode "acme"), and it forwards plain HTTP for the same hosts
# to portholed's port 80 (ACME HTTP-01 challenge and the redirect to https://).
#
# How to use it in Dokploy:
#   1. DNS: A records for tun.example.com and *.tun.example.com pointing at the server running Dokploy.
#   2. Create a Compose service, choose "Raw" as the source and paste this file.
#   3. Replace tun.example.com in the labels below (the three Traefik rules) and in PORTHOLED_DOMAIN with your domain.
#   4. Deploy, then create a token:
#        docker exec -it <container> /usr/local/bin/portholed token create --name home
#      (Dokploy shows the container name under Logs; the image has no shell, so run the binary directly.)
#
# Requirements and notes:
#   - The TCP routers need Traefik v3 (Dokploy's default) and its `websecure` and `web` entrypoints on 443 and 80. On
#     Traefik v2 the HostSNIRegexp syntax differs.
#   - TCP tunnel ports and the SSH gateway are published directly, not through Traefik. Open them in the firewall.
#   - Because Traefik passes the connection through, portholed would see Traefik's address as the peer of every
#     visitor and client. So Traefik announces the real address with the PROXY protocol v2 (the proxyProtocol label on
#     the TCP service below) and portholed accepts it only from PORTHOLED_TRUSTED_PROXIES. Leave
#     trust_proxy_headers off: passthrough HTTPS carries no X-Forwarded-For.
#   - Only HTTPS goes through the PROXY protocol. Traefik's HTTP routers cannot send it, so the plain HTTP listener
#     (challenge and redirect) still sees Traefik's address; it serves no tunnel traffic.
#   - To test without touching Let's Encrypt production limits (50 certificates per registered domain per week),
#     uncomment PORTHOLED_ACME_CA below. Staging certificates are not trusted by browsers.
#   - Dollar signs in Traefik rules are doubled ($$) because Compose would otherwise interpolate them.

services:
  portholed:
    # A fixed version, not :latest: a redeploy must not pull whatever was released last. The :latest tag is not set for
    # pre-releases at all. To update, change the version here after reading the release notes; to pin by content, use
    # `portholed:0.3.0-alpha.2@sha256:<digest>` (digest from `docker buildx imagetools inspect <image>:<tag>`) and
    # verify the signature first, see docs/install.md#verifying-a-download.
    image: ghcr.io/eto-a/porthole/portholed:0.3.0-alpha.2
    restart: unless-stopped
    # Environment-only setup: no configuration file.
    command: ["serve", "--config", ""]
    environment:
      PORTHOLED_DOMAIN: tun.example.com
      # TLS mode acme is the default; the HTTPS listener is :443 and the plain HTTP one (challenge, redirect) is :80,
      # both inside the container.
      # PORTHOLED_ACME_EMAIL: you@example.com
      # PORTHOLED_ACME_CA: https://acme-staging-v02.api.letsencrypt.org/directory
      PORTHOLED_TCP_PORT_RANGE: "20000-20099"
      PORTHOLED_SSH_LISTEN: ":2222"
      # Accept PROXY protocol headers on the HTTPS listener from the proxies below, and require them from those
      # proxies. A peer in this list can claim any visitor address, so keep it as narrow as you can. The value below
      # is an EXAMPLE: put the subnet of dokploy-network, where Traefik runs, which you get with
      #   docker network inspect dokploy-network -f '{{(index .IPAM.Config 0).Subnet}}'
      # (an overlay network, often 10.0.1.0/24). A wrong value fails closed: Traefik is then not trusted, its header is
      # refused and HTTPS stops working, so a typo cannot open anything up.
      # Caveat: every container on dokploy-network (your other Dokploy apps and databases) is inside that subnet and
      # could connect to portholed:443 itself with a forged header. If you can, give Traefik and portholed a network of
      # their own and list only that subnet (or only Traefik's address, if it is fixed). Do not widen this to
      # 10.0.0.0/8 or 172.16.0.0/12.
      # Connections from any other address (the published TCP tunnel ports) must NOT send a header.
      # The SSH gateway on 2222 is published directly and is NOT wrapped (that needs PORTHOLED_PROXY_PROTOCOL_SSH).
      PORTHOLED_PROXY_PROTOCOL: "true"
      PORTHOLED_TRUSTED_PROXIES: "10.0.1.0/24"
    ports:
      # TCP/SSH tunnels. Keep the range in sync with PORTHOLED_TCP_PORT_RANGE; a small range keeps Docker's port
      # publishing fast.
      - "20000-20099:20000-20099"
      # SSH gateway (`ssh -J`).
      - "2222:2222"
    volumes:
      # Database and, in <data_dir>/certs, the certificates and the ACME account. Keep it across redeploys, or every
      # restart orders new certificates and runs into the Let's Encrypt limits.
      - porthole-data:/var/lib/porthole
    sysctls:
      # Allow the non-root process to bind ports 443 and 80 (capabilities are dropped below).
      net.ipv4.ip_unprivileged_port_start: 0
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - dokploy-network
    labels:
      - traefik.enable=true
      - traefik.docker.network=dokploy-network

      # HTTPS: TLS passthrough by SNI, to port 443 of the container. Traefik does not decrypt anything.
      - traefik.tcp.routers.porthole-tls-apex.rule=HostSNI(`tun.example.com`)
      - traefik.tcp.routers.porthole-tls-apex.entrypoints=websecure
      - traefik.tcp.routers.porthole-tls-apex.tls.passthrough=true
      - traefik.tcp.routers.porthole-tls-apex.service=porthole-tls
      - traefik.tcp.routers.porthole-tls-wild.rule=HostSNIRegexp(`^[a-z0-9-]+\.tun\.example\.com$$`)
      - traefik.tcp.routers.porthole-tls-wild.entrypoints=websecure
      - traefik.tcp.routers.porthole-tls-wild.tls.passthrough=true
      - traefik.tcp.routers.porthole-tls-wild.service=porthole-tls
      - traefik.tcp.services.porthole-tls.loadbalancer.server.port=443
      # Send the real visitor address to portholed (PROXY protocol v2); see PORTHOLED_PROXY_PROTOCOL above.
      - traefik.tcp.services.porthole-tls.loadbalancer.proxyProtocol.version=2

      # HTTP: ACME HTTP-01 challenge and the redirect to https://, to port 80 of the container.
      - traefik.http.routers.porthole-http.rule=Host(`tun.example.com`) || HostRegexp(`^[a-z0-9-]+\.tun\.example\.com$$`)
      - traefik.http.routers.porthole-http.entrypoints=web
      - traefik.http.routers.porthole-http.service=porthole-http
      - traefik.http.services.porthole-http.loadbalancer.server.port=80

networks:
  dokploy-network:
    external: true

volumes:
  porthole-data:
